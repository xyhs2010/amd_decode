[project]
name = "amd-decode"
version = "0.1.0"
description = "用 AMD gpu 做 decode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
amd-decode = "amd_decode:main"

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "ninja"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build-dir = "build"
wheel.packages = ["src/amd_decode"]  
